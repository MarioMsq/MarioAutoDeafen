name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-2022
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      # На сервере стоит слишком новый компилятор Clang 20, с которым не собирается
      # библиотека fmt из Geode. Ставим Clang 19.
      - name: Install Clang 19
        shell: pwsh
        run: |
          choco install llvm --version=19.1.7 --allow-downgrade --force -y --no-progress
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
